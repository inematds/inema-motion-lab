<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dock líquido · INEMA Motion Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--bg2:#111114;--fg:#f3efe7;--fg2:#a69d90;--acc:#E2A23B;--b:44px;--g:8px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;overflow:hidden}
.palco{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,var(--bg2) 0%,var(--bg) 62%)}
.blob{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(70px);opacity:.3;pointer-events:none;will-change:transform}
.blob.a{background:var(--acc);left:-10vmax;top:-14vmax}
.blob.b{background:#8a4b1f;right:-14vmax;top:4vmax}
.blob.c{background:#2e2a57;left:24vw;bottom:-24vmax}
.cabeca{position:absolute;left:clamp(20px,6vw,88px);top:clamp(56px,13vh,132px);right:20px}
.selo{font:500 12px/1 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
h1{font-family:Sora,sans-serif;font-weight:800;font-size:clamp(2.6rem,9vw,6.4rem);line-height:1.05;letter-spacing:-.025em;margin:20px 0 16px;min-height:1.1em}
.titulo span{display:inline-block;animation:sobe .62s cubic-bezier(.2,1.25,.35,1) both}
@keyframes sobe{from{transform:translateY(.7em);opacity:0}to{transform:none;opacity:1}}
.sub{margin:0;max-width:34ch;font-size:clamp(1rem,2vw,1.25rem);line-height:1.5;color:var(--fg2)}
.dica{margin:14px 0 0;font:500 12px/1.4 'JetBrains Mono',monospace;letter-spacing:.08em;color:var(--fg2);opacity:.8}

.dock{position:fixed;left:50%;bottom:clamp(20px,9vh,80px);transform:translateX(-50%);z-index:5;display:flex;align-items:flex-end;gap:var(--g);padding:12px;border-radius:26px;background:rgba(22,22,28,.46);-webkit-backdrop-filter:blur(18px) saturate(190%);backdrop-filter:blur(18px) saturate(190%);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 22px 50px rgba(0,0,0,.45)}
.brilho{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.reflexo{position:absolute;top:-30%;left:0;width:180px;height:160%;background:radial-gradient(closest-side,rgba(255,255,255,.2),transparent);opacity:0;transition:opacity .25s}
.dock.brilhando .reflexo{opacity:1}
.slot{position:relative;flex:0 0 auto;width:var(--b);height:var(--b)}
.item{position:absolute;inset:0;margin:0;padding:0;border:0;background:none;cursor:pointer;border-radius:22%;color:var(--fg);-webkit-tap-highlight-color:transparent}
.item:focus{outline:none}
.item:focus-visible{outline:3px solid var(--acc);outline-offset:4px}
.tile{position:absolute;bottom:0;left:calc(50% - var(--b) / 2);width:var(--b);height:var(--b);border-radius:23%;display:grid;place-items:center;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.35);transform-origin:50% 100%;will-change:transform}
.tile svg{width:52%;height:52%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.com-dia .tile svg{transform:translateY(-12%)}
.dia{position:absolute;left:0;right:0;bottom:9%;text-align:center;font:700 11px/1 Sora,sans-serif;color:var(--fg)}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#ff5a4e;color:#fff;font:600 11px/20px Inter,sans-serif;text-align:center;box-shadow:0 0 0 2px #14141a}
.ponto{position:absolute;left:50%;bottom:-9px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--fg);opacity:0;transition:opacity .2s}
.item.ativo .ponto{opacity:.9}
.sep{flex:0 0 auto;width:1px;height:calc(var(--b) * .7);align-self:center;background:rgba(255,255,255,.2)}

.rotulo{position:fixed;left:0;top:0;padding:6px 10px;border-radius:9px;background:rgba(12,12,16,.88);color:var(--fg);font:500 13px/1 Inter,sans-serif;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .18s ease;z-index:6}
.rotulo.on{opacity:1}
.rotulo span{display:block;transform:translateY(8px);transition:transform .22s ease}
.rotulo.on span{transform:none}

.mascote{position:fixed;left:0;top:0;width:84px;height:60px;pointer-events:none;opacity:0;z-index:7}
.mascote.acena{animation:pula 1.9s ease-in-out both}
@keyframes pula{0%{opacity:0;transform:translateY(30px) scale(.4)}15%{opacity:1;transform:translateY(-44px) scale(1)}40%{opacity:1;transform:translateY(-44px) rotate(-6deg)}52%{transform:translateY(-44px) rotate(6deg)}62%{transform:translateY(-44px) rotate(-4deg)}72%{transform:translateY(-44px) rotate(0)}88%{opacity:1;transform:translateY(20px) scale(.6)}100%{opacity:0;transform:translateY(40px) scale(.2)}}

.fantasma{position:fixed;left:0;top:0;width:26px;height:26px;pointer-events:none;opacity:0;z-index:40;will-change:transform,opacity}
.fantasma svg{width:26px;height:26px;transition:transform .12s ease}
.fantasma.aperta svg{transform:scale(.85)}

.xray-caixa{position:fixed;left:0;top:0;border:1px dashed var(--acc);pointer-events:none}
.xray-rotulo{position:fixed;left:0;top:0;padding:4px 6px;border-radius:4px;background:var(--acc);color:#0b0b0d;font:500 10px/1.2 'JetBrains Mono',monospace;white-space:nowrap;pointer-events:none}
#xray-layer{position:fixed;inset:0;pointer-events:none;z-index:100}

.parado .titulo span,.parado .mascote,.parado .fantasma{animation:none!important;transition:none!important}
.parado .mascote,.parado .fantasma{display:none}
.parado .rotulo,.parado .reflexo,.parado .item .ponto{transition:none}
</style>
</head>
<body>
<main class="palco" id="palco">
  <div class="blob a" aria-hidden="true" data-xray="fundo · manchas âmbar e ardósia derivam devagar" data-xray-tool="code"></div>
  <div class="blob b" aria-hidden="true" data-xray="fundo · mancha de cobre que flutua em outro ritmo" data-xray-tool="code"></div>
  <div class="blob c" aria-hidden="true" data-xray="fundo · mancha violeta no rodapé" data-xray-tool="code"></div>

  <section class="cabeca">
    <div class="selo">INEMA.CLUB · barra de atalhos</div>
    <h1 id="titulo" aria-live="polite" data-xray="título · cada letra sobe em cascata (34 ms) a cada troca de seção" data-xray-tool="code"></h1>
    <p class="sub">Estude no seu ritmo. Tudo do ecossistema INEMA num lugar só.</p>
    <p class="dica">Passe o ponteiro sobre a barra, ou use Tab e Enter.</p>
  </section>

  <nav class="dock" id="dock" aria-label="Atalhos do INEMA" data-xray="barra · cresce perto do ponteiro (gaussiana) e fica líquida" data-xray-tool="code">
    <div class="brilho" aria-hidden="true"><div class="reflexo" id="reflexo" data-xray="reflexo · segue o ponteiro dentro da barra" data-xray-tool="code"></div></div>
    <div id="row" style="display:flex;align-items:flex-end;gap:var(--g);position:relative;z-index:1"></div>
  </nav>

  <div class="rotulo" id="rotulo" aria-hidden="true" data-xray="rótulo · aparece e sobe 8 px sobre o ícone em foco" data-xray-tool="code"><span></span></div>
  <div class="mascote" id="mascote" aria-hidden="true" data-xray="capivara · sai do ícone Início, acena e mergulha de volta" data-xray-tool="code">
    <svg viewBox="0 0 84 60" width="84" height="60">
      <ellipse cx="38" cy="38" rx="28" ry="16" fill="#9b6b43"/>
      <rect x="50" y="18" width="26" height="24" rx="10" fill="#9b6b43"/>
      <rect x="66" y="26" width="14" height="13" rx="6" fill="#8a5a36"/>
      <circle cx="56" cy="16" r="3.5" fill="#7a5232"/>
      <circle cx="60" cy="28" r="2" fill="#17120f"/>
      <circle cx="68" cy="31" r="1.4" fill="#17120f"/>
      <rect x="18" y="46" width="4" height="12" rx="2" fill="#7a5232"/>
      <rect x="30" y="46" width="4" height="12" rx="2" fill="#7a5232"/>
      <rect x="44" y="46" width="4" height="12" rx="2" fill="#7a5232"/>
      <rect x="54" y="46" width="4" height="12" rx="2" fill="#7a5232"/>
    </svg>
  </div>
  <div class="fantasma" id="fantasma" aria-hidden="true" data-xray="cursor fantasma · percorre a barra e clica sozinho" data-xray-tool="code">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 2.5 4 19l4.6-4.3 2.9 6.2 3-1.4-2.9-6.1H18z" fill="#f3efe7" stroke="#0b0b0d" stroke-width="1.2" stroke-linejoin="round"/></svg>
  </div>
</main>
<script>
(function () {
  var params = location.search;
  var demoParam = /[?&]demo=1\b/.test(params);
  var xrayOn = /[?&]motion=xray\b/.test(params);
  var mqReduz = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var parado = !!(mqReduz && mqReduz.matches) || /[?&]motion=off\b/.test(params);
  if (parado) document.documentElement.classList.add('parado');

  var MAXS = 1.9, K = 520, D = 34;
  var ITENS = [
    {nome: 'Início', ico: '<path d="M4 11 12 4.5 20 11"/><path d="M6 10v9.5h4v-5.5h4v5.5h4V10"/>'},
    {nome: 'Buscas', ico: '<circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.6 15.6 4.4 4.4"/>'},
    {nome: 'Cursos', ico: '<path d="M3.5 6.5C6 5.2 9 5.2 12 6.7c3-1.5 6-1.5 8.5-.2v11.5c-2.5-1.3-5.5-1.3-8.5.2-3-1.5-6-1.5-8.5-.2z"/><path d="M12 6.7v11.5"/>'},
    {nome: 'Lives', ico: '<rect x="3.8" y="5.2" width="16.4" height="15" rx="3"/><path d="M3.8 10h16.4M8 3.2v3.6M16 3.2v3.6"/>', dia: true},
    {nome: 'VIP', ico: '<path d="M4 8.5 8 13l4-6 4 6 4-4.5V18H4z"/>'},
    {nome: 'Vídeos', ico: '<rect x="3" y="6" width="18" height="12.5" rx="3.5"/><path d="m10.2 9.4 4.6 2.7-4.6 2.7z" fill="currentColor"/>', badge: '3'},
    {nome: 'Kits', ico: '<path d="M12 3.4 19.4 7.6v8.8L12 20.6l-7.4-4.2V7.6z"/><path d="m4.6 7.6 7.4 4.2 7.4-4.2M12 11.8v8.8"/>'},
    {sep: true},
    {nome: 'PRO', ico: '<path d="m12 4 2.3 4.9 5.2.7-3.8 3.6 1 5.2L12 15.5l-4.7 2.9 1-5.2-3.8-3.6 5.2-.7z"/>'}
  ];
  var N_ITENS = ITENS.filter(function (x) { return !x.sep; }).length;

  var dock = document.getElementById('dock'), row = document.getElementById('row');
  var rot = document.getElementById('rotulo'), tit = document.getElementById('titulo');
  var fantasma = document.getElementById('fantasma'), mascote = document.getElementById('mascote');
  var reflexo = document.getElementById('reflexo'), palco = document.getElementById('palco');
  var blobs = Array.prototype.slice.call(document.querySelectorAll('.blob'));
  var linha = [], itens = [];
  var hoje = new Date().getDate();

  ITENS.forEach(function (it) {
    if (it.sep) {
      var sp = document.createElement('span');
      sp.className = 'sep';
      sp.setAttribute('aria-hidden', 'true');
      row.appendChild(sp);
      linha.push(null);
      return;
    }
    var i = itens.length;
    var sl = document.createElement('div');
    sl.className = 'slot';
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'item';
    b.setAttribute('aria-label', it.nome);
    b.setAttribute('data-xray', it.nome + ' · cresce perto do ponteiro e pula ao clicar');
    b.setAttribute('data-xray-tool', 'code');
    var dia = it.dia ? '<span class="dia">' + hoje + '</span>' : '';
    var badge = it.badge ? '<span class="badge">' + it.badge + '</span>' : '';
    if (it.dia) b.classList.add('com-dia');
    b.innerHTML = '<span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true">' + it.ico + '</svg>' + dia + badge + '</span><span class="ponto" aria-hidden="true"></span>';
    sl.appendChild(b);
    row.appendChild(sl);
    var o = {nome: it.nome, el: b, slot: sl, tile: b.querySelector('.tile'), s: {x: 1, v: 0}, y: {x: 0, v: 0}, sq: {x: 0, v: 0}, sd: 1, w: 0, cx: 0};
    itens.push(o);
    linha.push(o);
    b.addEventListener('click', function () { ativar(i); acordar(); });
    b.addEventListener('focus', function () { foco = i; acordar(); });
    b.addEventListener('blur', function () { if (foco === i) foco = -1; acordar(); });
  });

  var ptr = {x: 0, on: false};
  var foco = -1, ativo = -1;
  var base = 44, G = 8, maxW = 600, glassW = 600, SIG = 100, vw = window.innerWidth, rowBottom = 0, dockX = 0;

  function medir() {
    vw = window.innerWidth;
    G = vw < 520 ? 4 : 8;
    maxW = Math.min(vw - 24, 760) - 26;
    base = Math.max(30, Math.min(54, Math.floor((maxW - N_ITENS * G - 1) / 9.2)));
    SIG = base * 2.2;
    /* vidro de largura fixa: repouso + folga de 2,2 ícones para o crescimento */
    glassW = Math.min(maxW, N_ITENS * base + N_ITENS * G + 1 + 2.2 * base);
    dockX = (vw - (glassW + 26)) / 2;
    dock.style.width = (glassW + 26) + 'px';
    row.style.width = glassW + 'px';
    row.style.justifyContent = 'center';
    document.documentElement.style.setProperty('--b', base + 'px');
    document.documentElement.style.setProperty('--g', G + 'px');
    var r = dock.getBoundingClientRect();
    rowBottom = r.bottom - 13;
  }

  function spring(o, tgt, dt, k, d) {
    var a = (tgt - o.x) * k - o.v * d;
    o.v += a * dt;
    o.x += o.v * dt;
  }

  function setTitulo(texto) {
    tit.textContent = '';
    Array.prototype.forEach.call(texto, function (c, k) {
      var s = document.createElement('span');
      s.textContent = c === ' ' ? ' ' : c;
      s.style.animationDelay = (k * 34) + 'ms';
      tit.appendChild(s);
    });
  }

  function ativar(i) {
    var o = itens[i];
    ativo = i;
    itens.forEach(function (p, j) { p.el.classList.toggle('ativo', j === i); });
    if (!parado) {
      o.y.v = -520;
      o.sq.x = 0.13;
      o.sq.v = 0;
    }
    if (o.nome === 'Início' && !parado) {
      mascote.style.left = (o.cx - 42) + 'px';
      mascote.style.top = (rowBottom - base - 70) + 'px';
      mascote.classList.remove('acena');
      void mascote.offsetWidth;
      mascote.classList.add('acena');
    }
    setTitulo(o.nome);
  }

  var xrayLista = [], xrayCamada = null;
  function xrayIniciar() {
    if (!xrayOn) return;
    xrayCamada = document.createElement('div');
    xrayCamada.id = 'xray-layer';
    xrayCamada.setAttribute('aria-hidden', 'true');
    document.body.appendChild(xrayCamada);
    document.querySelectorAll('[data-xray]').forEach(function (el) {
      var c = document.createElement('div'); c.className = 'xray-caixa';
      var t = document.createElement('div'); t.className = 'xray-rotulo';
      t.textContent = el.getAttribute('data-xray');
      xrayCamada.appendChild(c); xrayCamada.appendChild(t);
      xrayLista.push({el: el, c: c, t: t});
    });
  }
  function xrayAtualizar() {
    if (!xrayOn) return;
    xrayLista.forEach(function (x) {
      var r = x.el.getBoundingClientRect();
      x.c.style.transform = 'translate3d(' + r.left.toFixed(1) + 'px,' + r.top.toFixed(1) + 'px,0)';
      x.c.style.width = r.width.toFixed(1) + 'px';
      x.c.style.height = r.height.toFixed(1) + 'px';
      x.t.style.transform = 'translate3d(' + r.left.toFixed(1) + 'px,' + Math.max(0, r.top - 20).toFixed(1) + 'px,0)';
    });
  }

  function desenhar() {
    var N = itens.length, fixo = N * G + 1;
    var sumE = 0;
    itens.forEach(function (o) { o.sd = Math.max(1, o.s.x); sumE += (o.sd - 1) * base; });
    var maxExtra = glassW - N * base - fixo;
    if (sumE > maxExtra) {
      var r = Math.max(0, maxExtra) / sumE;
      itens.forEach(function (o) { o.sd = 1 + (o.sd - 1) * r; });
    }
    /* slots têm largura fixa; o crescimento e o empurrão dos vizinhos são só transform */
    itens.forEach(function (o) { o.w = base * o.sd; });
    var visTotal = fixo, unTotal = fixo + N * base;
    itens.forEach(function (o) { visTotal += o.w; });
    var vx = (glassW - visTotal) / 2, ux = (glassW - unTotal) / 2;
    linha.forEach(function (e) {
      if (!e) { vx += 1 + G; ux += 1 + G; return; }
      var vc = vx + e.w / 2, uc = ux + base / 2;
      e.cx = dockX + 13 + vc;
      e.tile.style.transform = 'translate3d(' + (vc - uc).toFixed(2) + 'px,' + e.y.x.toFixed(2) + 'px,0) scale(' + (e.sd * (1 + e.sq.x)).toFixed(4) + ',' + (e.sd * (1 - e.sq.x)).toFixed(4) + ')';
      vx += e.w + G; ux += base + G;
    });

    var pon = foco >= 0 || ptr.on;
    var px = foco >= 0 ? itens[foco].cx : ptr.x;
    var idxR = -1;
    if (foco >= 0) idxR = foco;
    else if (ptr.on) itens.forEach(function (o, i) { if (Math.abs(ptr.x - o.cx) <= o.w / 2) idxR = i; });
    if (idxR >= 0) {
      var alvoR = itens[idxR];
      rot.firstElementChild.textContent = alvoR.nome;
      rot.style.transform = 'translate3d(' + alvoR.cx.toFixed(1) + 'px,' + (rowBottom - base * alvoR.sd - 44).toFixed(1) + 'px,0) translateX(-50%)';
      rot.classList.add('on');
    } else {
      rot.classList.remove('on');
    }
    dock.classList.toggle('brilhando', pon);
    reflexo.style.transform = 'translate3d(' + (px - dockX - 90).toFixed(1) + 'px,0,0)';
    xrayAtualizar();
  }

  function gStep(dt, t) {
    if (ghostParado) {
      gOp = Math.max(0, gOp - dt / 0.3);
      if (gOp === 0) ghostAtivo = false;
    } else {
      gOp = Math.min(1, gOp + dt / 0.4);
    }
    fantasma.style.opacity = gOp.toFixed(3);
    fantasma.style.transform = 'translate3d(' + gPos.x.toFixed(1) + 'px,' + gPos.y.toFixed(1) + 'px,0)';
    if (ghostParado) return;
    gT += dt;
    if (gFase === 0) {
      gDest = {x: itens[SEQ[gIdx]].cx, y: rowBottom - base / 2};
      var k = Math.min(1, gT / 0.9);
      var e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      gPos = {x: gOri.x + (gDest.x - gOri.x) * e, y: gOri.y + (gDest.y - gOri.y) * e};
      ptr.x = gPos.x; ptr.on = true;
      if (k >= 1) { gFase = 1; gT = 0; gClicou = false; }
    } else if (gFase === 1) {
      if (!gClicou && gT >= 0.12) {
        gClicou = true;
        fantasma.classList.add('aperta');
        ativar(SEQ[gIdx]);
      }
      if (gT >= 0.3) fantasma.classList.remove('aperta');
      if (gT >= 0.35) { gFase = 2; gT = 0; }
    } else {
      if (gT >= 1.1) {
        gIdx = (gIdx + 1) % SEQ.length;
        gOri = {x: gPos.x, y: gPos.y};
        gFase = 0; gT = 0;
      }
    }
  }

  function passo(dt, t) {
    var pon = foco >= 0 || ptr.on;
    var px = foco >= 0 ? itens[foco].cx : ptr.x;
    itens.forEach(function (o) {
      if (parado) { o.s.x = 1; o.s.v = 0; o.y.x = 0; o.y.v = 0; o.sq.x = 0; o.sq.v = 0; return; }
      var tgt = 1;
      if (pon) { var d = px - o.cx; tgt = 1 + (MAXS - 1) * Math.exp(-(d * d) / (2 * SIG * SIG)); }
      spring(o.s, tgt, dt, K, D);
      spring(o.y, 0, dt, 600, 20);
      spring(o.sq, 0, dt, 300, 16);
    });
    if (!parado) {
      blobs.forEach(function (b, i) {
        b.style.transform = 'translate3d(' + (Math.sin(t * 0.11 + i * 1.9) * 6).toFixed(2) + 'vw,' + (Math.cos(t * 0.09 + i * 2.3) * 5).toFixed(2) + 'vh,0)';
      });
    }
    if (ghostAtivo) gStep(dt, t);
  }

  var raf = 0, last = 0, vis = true;
  function quadro(t) {
    raf = 0;
    var dt = last ? Math.min(1 / 30, (t - last) / 1000) : 1 / 60;
    last = t;
    passo(dt, t / 1000);
    desenhar();
    if (vis && !document.hidden) raf = requestAnimationFrame(quadro);
  }
  function ligar() {
    if (parado || raf || !vis || document.hidden) return;
    last = 0;
    raf = requestAnimationFrame(quadro);
  }
  function desligar() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
  function acordar() { if (parado) desenhar(); else ligar(); }

  /* cursor fantasma: roda até a primeira interação real (exceto ?demo=1) */
  var ghostAtivo = !parado, ghostParado = false, gT = 0, gFase = 0, gIdx = 0, gClicou = false, gOp = 0;
  var gPos = {x: window.innerWidth / 2, y: window.innerHeight + 40}, gOri = {x: window.innerWidth / 2, y: window.innerHeight + 40}, gDest = {x: 0, y: 0};
  var SEQ = [1, 4, 6, 2];
  function pararFantasma() {
    if (demoParam || ghostParado || !ghostAtivo) return;
    ghostParado = true;
    ptr.on = false;
  }
  ['pointermove', 'pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(function (ev) {
    window.addEventListener(ev, pararFantasma, {capture: true, passive: true});
  });

  dock.addEventListener('pointermove', function (e) { ptr.x = e.clientX; ptr.on = true; acordar(); });
  dock.addEventListener('pointerleave', function () { ptr.on = false; acordar(); });
  window.addEventListener('resize', function () { medir(); acordar(); });

  setTitulo('Início');
  medir();
  xrayIniciar();
  desenhar();
  var io = new IntersectionObserver(function (es) {
    vis = es[0].isIntersecting;
    if (vis) ligar(); else desligar();
  });
  io.observe(palco);
  document.addEventListener('visibilitychange', function () { if (document.hidden) desligar(); else ligar(); });
  acordar();
})();
</script>
