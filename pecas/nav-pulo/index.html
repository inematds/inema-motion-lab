<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navegação com pulo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<script>
  // ?demo=1 demonstração contínua · ?motion=off parado no estado final · ?motion=xray raio-X
  (function () {
    var q = location.search, m = (q.match(/[?&]motion=([a-z]+)/) || [])[1] || '';
    window.MOTION = { demo: /[?&]demo=1\b/.test(q), off: m === 'off', xray: m === 'xray' };
    if (MOTION.off) document.documentElement.classList.add('motion-off');
  })();
</script>
<style>
  :root {
    --bg: #0b0b0d; --surface: #111114; --fg: #f3efe7; --fg-2: rgba(243,239,231,.62);
    --accent: #E2A23B; --ink: #0b0b0d; --line: #24242a;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; }

  main {
    position: relative; height: 100vh; height: 100dvh; width: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px; text-align: center; overflow: hidden;
    background:
      radial-gradient(60% 50% at 50% 30%, rgba(226,162,59,.08), transparent 70%),
      var(--bg);
  }
  .label {
    font-family: "JetBrains Mono", ui-monospace, monospace; font-weight: 500;
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent);
  }
  .label b { color: var(--fg); font-weight: 500; }

  /* ---------- barra de navegação ---------- */
  .nav-wrap { position: relative; padding-top: 86px; margin-top: 4px; max-width: 100%; }
  nav {
    position: relative; display: flex; gap: 2px; padding: 5px;
    background: var(--surface); border: 2.5px solid var(--fg); border-radius: 999px;
    box-shadow: 5px 5px 0 var(--accent);
  }
  .tab {
    position: relative; z-index: 2; appearance: none; border: 0; background: transparent;
    color: var(--fg); font: 600 17px/1 Inter, system-ui, sans-serif;
    padding: 15px 26px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    transition: color 220ms ease;
  }
  .tab[aria-current="page"] { color: var(--ink); }
  .tab:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .tab:hover:not([aria-current="page"]) { color: var(--accent); }

  /* pílula ativa: duas tampas + meio, só transform */
  .pill { position: absolute; left: 0; top: 5px; height: 0; z-index: 1; pointer-events: none; }
  .pill > div { position: absolute; left: 0; top: 0; will-change: transform; }
  .cap { overflow: hidden; }
  .cap i {
    position: absolute; top: 0; display: block; border-radius: 50%;
    background: var(--accent); border: 2.5px solid var(--ink);
  }
  .mid { width: 100px; background: var(--accent); border-top: 2.5px solid var(--ink); border-bottom: 2.5px solid var(--ink); transform-origin: 0 0; }

  /* mascote */
  .buddy {
    position: absolute; left: 0; top: 0; width: 88px; height: 80px; pointer-events: none; z-index: 3;
    will-change: transform;
  }
  .buddy-in { width: 100%; height: 100%; transform-origin: 50% 100%; will-change: transform; }
  .buddy svg { width: 100%; height: 100%; overflow: visible; display: block; }

  /* ---------- título que troca letra a letra ---------- */
  .copy { margin-top: clamp(30px, 8vh, 72px); max-width: 760px; width: 100%; }
  .roll {
    display: grid; margin: 0; font-family: Sora, Inter, sans-serif; font-weight: 700;
    font-size: clamp(2.1rem, 7vw, 4.6rem); line-height: 1.08; letter-spacing: -.035em;
  }
  .roll > .layer { grid-area: 1 / 1; }
  .w { display: inline-block; white-space: nowrap; }
  .cw { display: inline-block; overflow: hidden; vertical-align: bottom; padding-top: .14em; margin-top: -.14em; }
  .c { display: inline-block; transform: translateY(112%); will-change: transform; }
  .layer.in .c { transform: none; transition: transform 560ms cubic-bezier(.3,1.65,.5,1); }
  .layer.out .c { transform: translateY(-135%); transition: transform 360ms cubic-bezier(.6,0,.85,.35); }
  .layer.static .c { transform: none; transition: none; }
  .roll .dot { color: var(--accent); }
  .sub {
    margin: 14px auto 0; max-width: 34em; color: var(--fg-2); font-size: clamp(1rem, 2.2vw, 1.2rem); line-height: 1.5;
    display: grid;
  }
  .sub span { grid-area: 1 / 1; opacity: 0; transform: translateY(6px); transition: opacity 300ms ease, transform 300ms ease; }
  .sub span.on { opacity: 1; transform: none; transition: opacity 420ms ease 180ms, transform 420ms ease 180ms; }
  .hint { margin-top: clamp(20px, 5vh, 44px); color: rgba(243,239,231,.4); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* cursor fantasma */
  .ghost { position: fixed; left: 0; top: 0; width: 30px; height: 30px; pointer-events: none;
    z-index: 10; opacity: 0; will-change: transform, opacity; }
  .ghost svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 3px 4px rgba(0,0,0,.45)); }
  .ring { position: fixed; left: -22px; top: -22px; width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid var(--accent); pointer-events: none; z-index: 9; opacity: 0; will-change: transform, opacity; }

  @media (max-width: 520px) {
    nav { padding: 4px; box-shadow: 4px 4px 0 var(--accent); }
    .tab { font-size: 13.5px; padding: 12px 13px; }
    .pill { top: 4px; }
    .nav-wrap { padding-top: 70px; }
    .buddy { width: 70px; height: 64px; }
  }
  @media (max-width: 359px) { .tab { padding: 11px 10px; font-size: 13px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  .motion-off *, .motion-off *::before, .motion-off *::after { transition: none !important; }
</style>
</head>
<body>
<main id="piece">
  <div class="label">INEMA<b>.CLUB</b> · navegação</div>

  <div class="nav-wrap" id="navWrap">
    <nav id="nav" aria-label="Seções do INEMA">
      <div class="pill" id="pill" aria-hidden="true">
        <div class="cap" id="capL"><i></i></div>
        <div class="mid" id="mid" data-xray="pílula ativa · duas bordas em mola, a da frente dura e a de trás mole" data-xray-tool="code"></div>
        <div class="cap" id="capR"><i></i></div>
      </div>
      <button class="tab" type="button" aria-current="page">Cursos</button>
      <button class="tab" type="button">Lives</button>
      <button class="tab" type="button">Buscas</button>
      <button class="tab" type="button">VIP</button>
    </nav>

    <div class="buddy" id="buddy" aria-hidden="true" data-xray="capivara · agacha, pula em arco, inclina e amassa ao pousar" data-xray-tool="code">
      <div class="buddy-in" id="buddyIn">
        <svg viewBox="0 0 64 58">
          <g id="flip">
            <g id="legB"><rect x="15" y="40" width="8" height="15" rx="4" fill="#6e4a2c"/></g>
            <g id="legB2"><rect x="24" y="41" width="8" height="14" rx="4" fill="#7a5232"/></g>
            <g id="legF"><rect x="38" y="41" width="8" height="14" rx="4" fill="#7a5232"/></g>
            <g id="legF2"><rect x="45" y="40" width="8" height="15" rx="4" fill="#6e4a2c"/></g>
            <ellipse cx="31" cy="34" rx="23" ry="14" fill="#9b6b43"/>
            <ellipse cx="27" cy="29" rx="15" ry="6" fill="#b48459" opacity=".55"/>
            <rect x="38" y="13" width="23" height="21" rx="8" fill="#9b6b43"/>
            <rect x="51" y="18" width="11" height="15" rx="5" fill="#7a5232"/>
            <circle cx="43" cy="13.5" r="4" fill="#7a5232"/>
            <g id="eye"><ellipse cx="49" cy="20" rx="2.2" ry="2.4" fill="#17120f"/></g>
            <circle cx="49.7" cy="19.2" r=".7" fill="#fff4d6"/>
            <ellipse cx="59" cy="22.5" rx="1.2" ry=".9" fill="#2a1d14"/>
            <path d="M37 31 Q44 37 52 33 L50 38 Q43 40 36 35 Z" fill="#E2A23B"/>
            <g id="arm"><rect x="-2.6" y="-1" width="5.2" height="14" rx="2.6" fill="#7a5232"/></g>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <div class="copy">
    <h1 class="roll" id="roll" aria-hidden="true" data-xray="título · letras saem rolando para cima, as novas sobem com 22 ms entre elas" data-xray-tool="code"></h1>
    <p class="sr" id="live" aria-live="polite"></p>
    <p class="sub" id="sub" aria-hidden="true" data-xray="frase de apoio · troca por cross-fade com 6 px" data-xray-tool="code"></p>
  </div>
  <div class="label hint">Clique numa aba ou use as setas ← →</div>
</main>

<div class="ring" id="ring" aria-hidden="true"></div>
<div class="ghost" id="ghost" aria-hidden="true">
  <svg viewBox="0 0 24 24"><path d="M3 2 L3 19.5 L7.6 15.4 L10.7 22 L13.8 20.6 L10.8 14.2 L17 14 Z" fill="#fffaf0" stroke="#17120f" stroke-width="1.5" stroke-linejoin="round"/></svg>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var nav = $('nav'), navWrap = $('navWrap'), tabs = [].slice.call(nav.querySelectorAll('.tab'));
  var capL = $('capL'), capR = $('capR'), mid = $('mid');
  var buddy = $('buddy'), buddyIn = $('buddyIn'), flip = $('flip'), arm = $('arm'), eye = $('eye');
  var legs = [$('legB'), $('legB2'), $('legF'), $('legF2')];
  var roll = $('roll'), sub = $('sub'), live = $('live');
  var ghost = $('ghost'), ring = $('ring');
  var mq = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  var DEMO = MOTION.demo;
  function reduce() { return mq.matches || MOTION.off; }

  var CONTENT = [
    ['Cursos gratuitos', 'Trilhas curtas para aprender IA do zero, no seu ritmo.'],
    ['Lives toda semana', 'Ao vivo, com perguntas, gravação e material de apoio.'],
    ['Ache em segundos', 'Busque aulas, guias e kits em todo o INEMA.'],
    ['Comunidade VIP', 'Grupo fechado no Telegram para quem quer ir mais fundo.']
  ];

  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeIO(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function easeO(t) { return 1 - Math.pow(1 - t, 3); }
  function bump(x, a, b) { if (x <= a || x >= b) return 0; return Math.sin(Math.PI * (x - a) / (b - a)); }

  // ---------- medidas ----------
  var geo = [], H = 40, navTop = 0, offX = 0, BW = 88, BH = 80;
  function measure() {
    geo = tabs.map(function (t) { return { l: t.offsetLeft, r: t.offsetLeft + t.offsetWidth, c: t.offsetLeft + t.offsetWidth / 2 }; });
    H = tabs[0].offsetHeight;
    navTop = nav.offsetTop; offX = nav.offsetLeft + nav.clientLeft;
    BW = buddy.offsetWidth; BH = buddy.offsetHeight;
    [capL, capR].forEach(function (c) { c.style.width = (H / 2) + 'px'; c.style.height = H + 'px'; c.firstChild.style.width = H + 'px'; c.firstChild.style.height = H + 'px'; });
    capR.firstChild.style.left = (-H / 2) + 'px';
    mid.style.height = H + 'px';
  }

  // ---------- estado ----------
  var active = 0;
  var pl = { x: 0, v: 0 }, pr = { x: 0, v: 0 }, kL = 520, kR = 170;  // bordas da pílula
  var bx = 0, face = 1;              // mascote
  var jump = null;                   // { x0, x1, t, T, h, dir }
  var sq = 0, sqV = 0;               // amassado (mola)
  var armA = 0, armV = 0, pointAt = -1;
  var clock = 0, blinkT = 2400;

  function setText(i, instant) {
    var txt = CONTENT[i][0], old = roll.querySelector('.layer.in, .layer.static');
    live.textContent = CONTENT[i][0] + '. ' + CONTENT[i][1];
    var layer = document.createElement('span');
    layer.className = 'layer';
    var n = 0;
    txt.split(' ').forEach(function (word, wi) {
      if (wi) layer.appendChild(document.createTextNode(' '));
      var w = document.createElement('span'); w.className = 'w';
      for (var k = 0; k < word.length; k++) {
        var cw = document.createElement('span'); cw.className = 'cw';
        var c = document.createElement('span'); c.className = 'c'; c.textContent = word[k];
        c.style.transitionDelay = (n++ * 22) + 'ms';
        cw.appendChild(c); w.appendChild(cw);
      }
      if (wi === txt.split(' ').length - 1) {
        var dw = document.createElement('span'); dw.className = 'cw';
        var d = document.createElement('span'); d.className = 'c dot'; d.textContent = '.';
        d.style.transitionDelay = (n++ * 22) + 'ms';
        dw.appendChild(d); w.appendChild(dw);
      }
      layer.appendChild(w);
    });
    roll.appendChild(layer);
    if (old) {
      if (instant) old.remove();
      else {
        old.className = 'layer out';
        [].forEach.call(old.querySelectorAll('.c'), function (c, k) { c.style.transitionDelay = (k * 12) + 'ms'; });
        setTimeout(function () { old.remove(); }, 900);
      }
    }
    if (instant) layer.className = 'layer static';
    else { void layer.offsetWidth; layer.className = 'layer in'; }

    // linha de apoio
    var s = document.createElement('span'); s.textContent = CONTENT[i][1];
    var olds = sub.querySelectorAll('span');
    sub.appendChild(s);
    [].forEach.call(olds, function (o) { o.classList.remove('on'); setTimeout(function () { o.remove(); }, 500); });
    if (instant) s.className = 'on'; else { void s.offsetWidth; s.className = 'on'; }
  }

  function activate(i, focus) {
    if (i === active && geo.length) { if (focus) tabs[i].focus(); return; }
    var from = active; active = i;
    tabs.forEach(function (t, k) { if (k === i) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current'); });
    if (focus) tabs[i].focus();
    var dir = geo[i].c > geo[from].c ? 1 : -1;
    // borda da frente dura, de trás mole
    if (dir > 0) { kR = 520; kL = 170; } else { kL = 520; kR = 170; }
    if (reduce()) {
      pl.x = geo[i].l; pr.x = geo[i].r; pl.v = pr.v = 0; bx = geo[i].c; jump = null; face = dir;
    } else {
      var dist = Math.abs(geo[i].c - bx);
      jump = { x0: bx, x1: geo[i].c, t: 0, T: clamp(300 + dist * 0.55, 340, 640), h: clamp(30 + dist * 0.16, 34, 84), dir: dir };
      face = dir;
    }
    pointAt = -1;
    setText(i, reduce());
    wake();
  }

  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { activate(i, false); });
    t.addEventListener('pointerenter', function (e) { if (e.pointerType !== 'touch' && i !== active) { pointAt = i; wake(); } });
    t.addEventListener('pointerleave', function () { if (pointAt === i) { pointAt = -1; wake(); } });
    t.addEventListener('focus', function () { if (i !== active) { pointAt = i; wake(); } });
    t.addEventListener('blur', function () { if (pointAt === i) { pointAt = -1; wake(); } });
  });
  nav.addEventListener('keydown', function (e) {
    var n = tabs.length, i = tabs.indexOf(document.activeElement);
    if (i < 0) i = active;
    var k = e.key, to = -1;
    if (k === 'ArrowRight') to = (i + 1) % n;
    else if (k === 'ArrowLeft') to = (i - 1 + n) % n;
    else if (k === 'Home') to = 0;
    else if (k === 'End') to = n - 1;
    if (to >= 0) { e.preventDefault(); activate(to, true); }
  });

  // ---------- render ----------
  function spring(s, target, k, d, dt) {
    var a = -k * (s.x - target) - d * s.v;
    s.v += a * dt; s.x += s.v * dt;
  }

  function render(dt) {
    if (!geo.length) return;
    var R = reduce(), sdt = dt / 1000, g = geo[active];
    // pílula
    if (R) { pl.x = g.l; pr.x = g.r; pl.v = pr.v = 0; }
    else {
      for (var s = 0; s < 2; s++) {
        spring(pl, g.l, kL, kL > 300 ? 34 : 20, sdt / 2);
        spring(pr, g.r, kR, kR > 300 ? 34 : 20, sdt / 2);
      }
    }
    var L = pl.x, Rr = Math.max(pr.x, L + H + 2);
    capL.style.transform = 'translateX(' + L.toFixed(2) + 'px)';
    capR.style.transform = 'translateX(' + (Rr - H / 2).toFixed(2) + 'px)';
    mid.style.transform = 'translateX(' + (L + H / 2 - 1).toFixed(2) + 'px) scaleX(' + ((Rr - L - H + 2) / 100).toFixed(4) + ')';

    // mascote: pulo
    var y = 0, rot = 0, tuck = 0;
    if (jump && !R) {
      jump.t += dt;
      var CROUCH = 100;
      if (jump.t < CROUCH) {
        sq = -0.18 * bump(jump.t, 0, CROUCH * 2); sqV = 0;
        bx = jump.x0;
      } else {
        var u = clamp((jump.t - CROUCH) / jump.T, 0, 1);
        bx = lerp(jump.x0, jump.x1, easeIO(u) * 0.35 + u * 0.65);
        y = -jump.h * 4 * u * (1 - u);
        rot = -jump.dir * 15 * Math.cos(Math.PI * u) * (1 - Math.pow(2 * u - 1, 8));
        tuck = bump(u, 0, 1);
        if (u < 0.2) sq = lerp(sq, 0.08, 0.3);
        if (u >= 1) { jump = null; bx = geo[active].c; sq = -0.24; sqV = 0; }
      }
    } else if (!jump) {
      bx = g.c;
    }
    if (R) { sq = 0; sqV = 0; }
    else if (!jump || jump.t >= 100) {
      var aS = -380 * sq - 14 * sqV; sqV += aS * sdt; sq += sqV * sdt;
    }
    // respiração
    var breathe = R ? 0 : 0.018 * Math.sin(clock / 520);

    // braço apontando
    var want = 0, wantFace = face;
    if (pointAt >= 0 && !jump) {
      var dx = geo[pointAt].c - bx;
      wantFace = dx > 0 ? 1 : -1;
      want = -112 + clamp(Math.abs(dx) / 14, 0, 18);   // braço levantado para a frente
    }
    if (!jump) face = wantFace;
    if (R) { armA = want; armV = 0; }
    else { var aA = -300 * (armA - want) - 24 * armV; armV += aA * sdt; armA += armV * sdt; }

    // piscar
    blinkT -= dt;
    var blink = 1;
    if (!R && blinkT < 120) { blink = Math.abs(blinkT - 60) / 60; if (blinkT <= 0) blinkT = 2200 + Math.random() * 2600; }

    var sy = 1 + sq + breathe, sx = 1 - sq * 0.7;
    var top = navTop - BH + BH * 0.1 + y;
    buddy.style.transform = 'translate(' + (bx + offX - BW / 2).toFixed(2) + 'px,' + top.toFixed(2) + 'px)';
    buddyIn.style.transform = 'rotate(' + rot.toFixed(2) + 'deg) scale(' + sx.toFixed(4) + ',' + sy.toFixed(4) + ')';
    flip.setAttribute('transform', face < 0 ? 'translate(64 0) scale(-1 1)' : '');
    arm.setAttribute('transform', 'translate(44 37) rotate(' + armA.toFixed(2) + ')');
    eye.setAttribute('transform', 'translate(0 20) scale(1 ' + blink.toFixed(3) + ') translate(0 -20)');
    var legS = 1 - 0.5 * tuck;
    for (var j = 0; j < legs.length; j++) {
      var hipY = j === 0 || j === 3 ? 40 : 41;
      legs[j].setAttribute('transform', 'translate(0 ' + hipY + ') scale(1 ' + legS.toFixed(3) + ') translate(0 ' + (-hipY) + ')');
    }
    if (window.xrayTick) xrayTick();
  }

  function settled() {
    if (!geo.length) return true;
    return !jump && Math.abs(pl.x - geo[active].l) < 0.2 && Math.abs(pr.x - geo[active].r) < 0.2 &&
      Math.abs(pl.v) + Math.abs(pr.v) < 0.5 && Math.abs(sq) < 0.002 && Math.abs(sqV) < 0.02;
  }

  // ---------- modo demonstração ----------
  var STEP = 2300;
  var demoOn = !reduce() || DEMO, demoE = 0, demoFade = 1, demoStopping = false, ringT = 1e9;
  var gFrom = null, gPos = null, nextClick = 1400, tourIdx = 0;
  function stopDemo(e) {
    if (DEMO || !demoOn || demoStopping) return;
    if (e && e.isTrusted === false) return;
    demoStopping = true;
  }
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (ev) {
    window.addEventListener(ev, stopDemo, { passive: true, capture: true });
  });
  function tabPoint(i) {
    var r = tabs[i].getBoundingClientRect();
    return [r.left + r.width * 0.6, r.top + r.height * 0.62];
  }
  function renderDemo(dt) {
    if (!demoOn) return;
    if (demoStopping) {
      demoFade = Math.max(0, demoFade - dt / 300);
      ghost.style.opacity = demoFade.toFixed(3);
      if (demoFade <= 0) { demoOn = false; ghost.style.display = 'none'; ring.style.display = 'none'; }
      return;
    }
    demoE += dt;
    var next = (tourIdx + 1) % tabs.length;
    var target = tabPoint(next);
    if (!gPos) { var r0 = nav.getBoundingClientRect(); gPos = [r0.right + 30, r0.bottom + 70]; gFrom = gPos.slice(); }
    // aproxima nos 700 ms antes do clique
    var lead = nextClick - demoE;
    if (lead <= 700 && lead > 0) {
      var t = easeIO(1 - lead / 700);
      gPos = [lerp(gFrom[0], target[0], t), lerp(gFrom[1], target[1], t)];
      if (lead < 450) pointAt = next;
    } else if (lead > 700) gFrom = gPos.slice();
    var press = 1;
    if (demoE >= nextClick) {
      activate(next, false); tourIdx = next; ringT = 0; gFrom = target.slice(); gPos = target.slice();
      nextClick += STEP;
    }
    if (ringT < 240) press = 1 - 0.15 * bump(ringT, 0, 240);
    ghost.style.opacity = clamp(demoE / 300, 0, 1).toFixed(3);
    ghost.style.transform = 'translate(' + (gPos[0] - 4).toFixed(1) + 'px,' + (gPos[1] - 3).toFixed(1) + 'px) scale(' + press.toFixed(3) + ')';
    ringT += dt;
    if (ringT < 500) {
      var k = ringT / 500;
      ring.style.opacity = (0.9 * (1 - k)).toFixed(3);
      ring.style.transform = 'translate(' + gFrom[0].toFixed(1) + 'px,' + gFrom[1].toFixed(1) + 'px) scale(' + (0.4 + 1.2 * easeO(k)).toFixed(3) + ')';
    } else ring.style.opacity = '0';
  }
  if (!demoOn) { ghost.style.display = 'none'; ring.style.display = 'none'; }

  // ---------- loop único ----------
  var visible = true, rafId = 0, last = 0;
  function frame(now) {
    rafId = 0;
    var dt = last ? Math.min(50, now - last) : 16;
    last = now; clock += dt;
    render(dt);
    renderDemo(dt);
    // com movimento reduzido e sem demonstração, o loop dorme quando tudo assenta
    if (!(reduce() && !demoOn && settled())) wake();
  }
  function running() { return visible && !document.hidden; }
  function wake() { if (!rafId && running()) rafId = requestAnimationFrame(frame); }
  function sleep() { if (rafId) { cancelAnimationFrame(rafId); rafId = 0; } last = 0; }
  document.addEventListener('visibilitychange', function () { document.hidden ? sleep() : wake(); });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) {
      visible = entries[entries.length - 1].isIntersecting;
      visible ? wake() : sleep();
    }).observe($('piece'));
  }
  if (mq.addEventListener) mq.addEventListener('change', function () {
    if (reduce() && !DEMO) { demoOn = false; ghost.style.display = 'none'; ring.style.display = 'none'; }
    render(0); wake();
  });
  addEventListener('resize', function () { measure(); render(0); wake(); });

  function start() {
    measure();
    pl.x = geo[0].l; pr.x = geo[0].r; bx = geo[0].c;
    setText(0, true);
    render(0); wake();
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
})();
</script>

<!-- Raio-X: ?motion=xray desenha contorno e etiqueta em tudo que se move -->
<style>
  .xr-layer { position: fixed; inset: 0; pointer-events: none; z-index: 9999; overflow: hidden; }
  .xr-box { position: absolute; left: 0; top: 0; border: 1.5px dashed #E2A23B; border-radius: 6px; }
  .xr-tag { position: absolute; left: -1.5px; bottom: 100%; margin-bottom: 3px; white-space: nowrap;
    font: 500 10px/1.25 "JetBrains Mono", ui-monospace, monospace; letter-spacing: .03em;
    color: #0b0b0d; background: #E2A23B; padding: 3px 6px; border-radius: 4px; }
  .xr-box.below .xr-tag { bottom: auto; top: 100%; margin: 3px 0 0; }
</style>
<script>
  (function () {
    if (!window.MOTION || !MOTION.xray) return;
    var els = [].slice.call(document.querySelectorAll('[data-xray]'));
    var layer = document.createElement('div'); layer.className = 'xr-layer'; layer.setAttribute('aria-hidden', 'true');
    var boxes = els.map(function (el) {
      var b = document.createElement('div'); b.className = 'xr-box';
      var t = document.createElement('span'); t.className = 'xr-tag'; t.textContent = el.getAttribute('data-xray');
      b.appendChild(t); layer.appendChild(b); return b;
    });
    document.body.appendChild(layer);
    window.xrayTick = function () {
      for (var i = 0; i < els.length; i++) {
        var r = els[i].getBoundingClientRect(), b = boxes[i];
        b.style.width = r.width + 'px'; b.style.height = r.height + 'px';
        b.style.transform = 'translate(' + r.left + 'px,' + r.top + 'px)';
        b.classList.toggle('below', r.top < 24);
      }
    };
    xrayTick(); addEventListener('resize', xrayTick); setTimeout(xrayTick, 600);
  })();
</script>
