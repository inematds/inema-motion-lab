<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Botões de geleia · INEMA Motion Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--bg2:#141217;--fg:#f3efe7;--fg2:#a69d90;--acc:#E2A23B;--ink:#17120f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;overflow:hidden}
.palco{position:fixed;inset:0;overflow:hidden;background:radial-gradient(90% 70% at 50% 45%,var(--bg2) 0%,var(--bg) 70%)}
.cabeca{position:absolute;left:0;right:0;top:clamp(28px,7vh,64px);text-align:center;padding:0 16px}
.selo{font:500 12px/1 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
h1{text-wrap:balance;margin:14px 0 10px;font:800 clamp(2rem,6vw,4.2rem)/1.05 Sora,sans-serif;letter-spacing:-.025em}
.sub{margin:0 auto;max-width:46ch;color:var(--fg2);font-size:clamp(1rem,1.8vw,1.15rem);line-height:1.5}

.mesa{position:absolute;left:50%;transform:translateX(-50%);width:min(800px,100vw);top:clamp(200px,32vh,236px);bottom:84px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:56px 40px;padding:0 16px}
.painel{position:absolute;left:0;right:0;bottom:clamp(22px,5vh,40px);margin:0;padding:0 16px;text-align:center;font:500 13px/1.4 'JetBrains Mono',monospace;letter-spacing:.06em;color:var(--fg2)}
.painel b{color:var(--acc);font-weight:500}
.so-toque{display:none}

/* celular: coluna única centrada no espaço livre, rótulos maiores, painel de contagem no rodapé */
@media (max-width:480px){
  .cabeca{top:28px}
  h1{font-size:1.9rem;margin:10px 0 8px}
  .sub{font-size:.95rem;max-width:30ch}
  .so-mouse{display:none}.so-toque{display:inline}
  .mesa{top:196px;bottom:64px;width:100vw;transform:translateX(-50%) scale(.86);transform-origin:50% 50%;gap:30px 0;align-content:space-evenly}
  .painel{bottom:22px;font-size:12px}
}
.geleia{position:relative;width:220px;height:76px;flex:0 0 auto}
.geleia > svg{position:absolute;left:0;top:0;width:220px;height:76px;overflow:visible;pointer-events:none;z-index:1}
.geleia .lip{transform:translateY(6px)}
.rotulo{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink);font:700 19px/1 Sora,sans-serif;letter-spacing:-.01em;white-space:nowrap;pointer-events:none;transform-origin:50% 50%;will-change:transform}
.pilula{display:inline-block;height:22px;min-width:24px;padding:0 8px;border-radius:999px;background:rgba(11,11,13,.16);font:600 12px/22px Inter,sans-serif;text-align:center;overflow:hidden;position:relative;vertical-align:middle}
.pilula span{display:block}
.pilula.rola span{animation:rola .42s cubic-bezier(.2,1.2,.3,1) both}
@keyframes rola{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
.real{position:absolute;inset:0;margin:0;padding:0;border:0;border-radius:999px;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:none;z-index:2}
.real:focus{outline:none}
.real:focus-visible{outline:3px solid var(--acc);outline-offset:6px}
/* partículas ficam ATRÁS das peles e dos rótulos de todos os botões: nunca cobrem texto */
.partic{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:0}
.queda{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:2}
.partic > *,.queda > *{position:absolute;left:0;top:0;will-change:transform,opacity;pointer-events:none}
.caixinha{width:34px;height:34px;display:block}
.selo-cart{position:absolute;right:-8px;top:-12px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--fg);color:var(--ink);font:700 13px/26px Inter,sans-serif;text-align:center;opacity:0;pointer-events:none;z-index:4;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.selo-cart.pop{animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.25);opacity:1}100%{transform:scale(1);opacity:1}}
.dedo{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2px solid rgba(243,239,231,.85);background:rgba(243,239,231,.18);pointer-events:none;opacity:0;z-index:50;will-change:transform,opacity}
.dedo.apertado{background:rgba(226,162,59,.45)}

.xray-caixa{position:fixed;left:0;top:0;border:1px dashed var(--acc);pointer-events:none}
.xray-rotulo{position:fixed;left:0;top:0;padding:4px 6px;border-radius:4px;background:var(--acc);color:#0b0b0d;font:500 10px/1.2 'JetBrains Mono',monospace;white-space:nowrap;pointer-events:none}
#xray-layer{position:fixed;inset:0;pointer-events:none;z-index:100}

.parado *,.parado *::before,.parado *::after{transition:none!important}
.parado .pilula.rola span{animation:none!important}
.parado .dedo{display:none}
</style>
</head>
<body>
<main class="palco" id="palco">
  <header class="cabeca" data-xray="título · topo fixo, sem movimento" data-xray-tool="code">
    <div class="selo">INEMA.CLUB · botões</div>
    <h1>Botões com corpo de geleia.</h1>
    <p class="sub"><span class="so-mouse">Clique, segure e arraste.</span><span class="so-toque">Toque, segure e puxe.</span> Cada botão tem uma pele macia por baixo do rótulo, e o rótulo acompanha a pele.</p>
  </header>

  <section class="mesa" id="mesa" data-xray="mesa · grade dos cinco botões" data-xray-tool="code"></section>

  <p class="painel" id="painel" aria-live="polite">inscrições <b id="n-insc">12</b> · curtidas <b id="n-curt">0</b> · kits <b id="n-kit">0</b></p>

  <div class="dedo" id="dedo" aria-hidden="true" data-xray="dedo fantasma · demonstra cada botão até o ponteiro chegar" data-xray-tool="code"></div>
</main>
<script>
(function () {
  var params = location.search;
  var demoParam = /[?&]demo=1\b/.test(params);
  var xrayOn = /[?&]motion=xray\b/.test(params);
  var mqReduz = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var parado = !!(mqReduz && mqReduz.matches) || /[?&]motion=off\b/.test(params);
  if (parado) document.documentElement.classList.add('parado');

  var W = 220, H = 76, PIN = 72, K = 230, D = 6.5, KC = 120, KS = 360, DS = 10;
  /* paleta INEMA: âmbar, creme, grafite (fundo) e um único verde discreto de apoio */
  var BOTOES = [
    {rotulo: 'Inscrever-se', cor: '#E2A23B', claro: '#F4C977', escuro: '#8C5C14', tinta: '#0b0b0d', luz: .42, aro: 'rgba(255,240,210,.6)', acao: 'conta', pilula: 12},
    {rotulo: 'Curtir', cor: '#2a262d', claro: '#3d3842', escuro: '#0e0d10', tinta: '#f3efe7', luz: .14, aro: 'rgba(226,162,59,.75)', acao: 'coracoes'},
    {rotulo: 'Pegar o kit', cor: '#f3efe7', claro: '#ffffff', escuro: '#a99e8c', tinta: '#0b0b0d', luz: .5, aro: 'rgba(255,255,255,.7)', acao: 'caixa'},
    {rotulo: 'Assistir', cor: '#2a262d', claro: '#3d3842', escuro: '#0e0d10', tinta: '#E2A23B', luz: .14, aro: 'rgba(243,239,231,.35)', acao: 'pulso'},
    {rotulo: 'Baixar kit', cor: '#86A98E', claro: '#B5CFBA', escuro: '#435C49', tinta: '#0b0b0d', luz: .36, aro: 'rgba(240,250,242,.5)', acao: 'seta'}
  ];
  var nInsc = document.getElementById('n-insc'), nCurt = document.getElementById('n-curt'), nKit = document.getElementById('n-kit'), curtidas = 0;

  var mesa = document.getElementById('mesa'), palco = document.getElementById('palco');
  var dedoEl = document.getElementById('dedo');

  /* contorno de cápsula amostrado em PIN pontos, com normal para fora */
  function estadio() {
    var r = H / 2, L = W - 2 * r, arco = Math.PI * r, P = 2 * L + 2 * arco, pts = [];
    for (var i = 0; i < PIN; i++) {
      var s = i * P / PIN, x, y, nx, ny, a;
      if (s < L) { x = r + s; y = 0; nx = 0; ny = -1; }
      else if (s < L + arco) { a = -Math.PI / 2 + (s - L) / r; x = W - r + r * Math.cos(a); y = r + r * Math.sin(a); nx = Math.cos(a); ny = Math.sin(a); }
      else if (s < 2 * L + arco) { x = W - r - (s - L - arco); y = H; nx = 0; ny = 1; }
      else { a = Math.PI / 2 + (s - 2 * L - arco) / r; x = r + r * Math.cos(a); y = r + r * Math.sin(a); nx = Math.cos(a); ny = Math.sin(a); }
      pts.push({x0: x, y0: y, nx: nx, ny: ny, x: x, y: y, vx: 0, vy: 0, tx: x, ty: y});
    }
    return pts;
  }
  /* caminho fechado em Catmull-Rom convertido para Bézier cúbica */
  function caminho(pts) {
    var n = pts.length, d = 'M' + pts[0].x.toFixed(2) + ' ' + pts[0].y.toFixed(2);
    for (var i = 0; i < n; i++) {
      var p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      var c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
      var c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
      d += ' C' + c1x.toFixed(2) + ' ' + c1y.toFixed(2) + ' ' + c2x.toFixed(2) + ' ' + c2y.toFixed(2) + ' ' + p2.x.toFixed(2) + ' ' + p2.y.toFixed(2);
    }
    return d + 'Z';
  }
  function spring(o, tgt, dt, k, d) { var a = (tgt - o.x) * k - o.v * d; o.v += a * dt; o.x += o.v * dt; }
  var ICONES = {
    caixa: '<svg class="caixinha" viewBox="0 0 34 34"><rect x="5" y="9" width="24" height="20" rx="3" fill="#F3EFE7"/><rect x="5" y="9" width="24" height="6" rx="2" fill="#D9D1C2"/><rect x="15" y="9" width="4" height="20" fill="#E2A23B"/></svg>',
    seta: '<svg class="caixinha" viewBox="0 0 34 34"><path d="M17 4v18m-8-7 8 8 8-8" fill="none" stroke="#f3efe7" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="6" y="26" width="22" height="4" rx="2" fill="#E2A23B"/></svg>'
  };
  var geleias = [];
  BOTOES.forEach(function (b, i) {
    var el = document.createElement('div');
    el.className = 'geleia';
    el.setAttribute('data-xray', b.rotulo + ' · pele de geleia: pontos com mola, esticam e afundam no toque');
    el.setAttribute('data-xray-tool', 'code');
    var clar = b.claro, esc = b.escuro;
    el.innerHTML =
      '<svg viewBox="0 0 220 76" aria-hidden="true">' +
      '<defs><linearGradient id="gp' + i + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + clar + '"/><stop offset=".7" stop-color="' + b.cor + '"/><stop offset="1" stop-color="' + esc + '"/></linearGradient>' +
      '<radialGradient id="gq' + i + '" cx=".5" cy="1" r=".65"><stop offset="0" stop-color="#fff" stop-opacity="' + (b.luz * 0.9).toFixed(2) + '"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>' +
      '<path class="lip" fill="' + esc + '" data-xray="borda de baixo · a \'sombra\' sólida que dá espessura" data-xray-tool="code"/>' +
      '<path class="pele" fill="url(#gp' + i + ')"/>' +
      '<path class="pool" fill="url(#gq' + i + ')"/>' +
      '<path class="borda" fill="none" stroke="' + b.aro + '" stroke-width="1.2"/>' +
      '<ellipse class="brilho" fill="#fff" opacity="' + b.luz + '"/>' +
      '<circle class="faisca" fill="#fff" opacity=".9"/>' +
      '</svg>' +
      '<span class="rotulo" style="color:' + b.tinta + '"><span class="txt">' + b.rotulo + '</span>' + (b.pilula ? '<span class="pilula"><span>' + b.pilula + '</span></span>' : '') + '</span>' +
      '<button class="real" type="button" aria-label="' + b.rotulo + '"></button>' +
      '<span class="queda"></span>' +
      '<span class="selo-cart">0</span>';
    el.insertAdjacentHTML('afterbegin', '<span class="partic" data-xray="partículas · nascem atrás da pele, nunca sobre o texto" data-xray-tool="code"></span>');
    mesa.appendChild(el);
    var g = {
      i: i, b: b, el: el,
      pele: el.querySelector('.pele'), lip: el.querySelector('.lip'), pool: el.querySelector('.pool'),
      borda: el.querySelector('.borda'), brilho: el.querySelector('.brilho'), faisca: el.querySelector('.faisca'),
      rot: el.querySelector('.rotulo'), txt: el.querySelector('.txt'), real: el.querySelector('.real'),
      partic: el.querySelector('.partic'), queda: el.querySelector('.queda'), selo: el.querySelector('.selo-cart'),
      pilulaEl: el.querySelector('.pilula'), pts: estadio(),
      S: {sx: 1, vx: 0, sy: 1, vy: 0}, hover: false, pressed: false, drag: false, px: W / 2, py: H / 2, sx0: 0, sy0: 0,
      itens: [], gotas: [], contagem: b.pilula || 0, selos: 0, rotuloOriginal: b.rotulo, timerRot: 0
    };
    g.lip.style.transform = 'translateY(6px)';
    geleias.push(g);
    ligarEventos(g);
  });

  function localizar(e, g) {
    var r = g.el.getBoundingClientRect();
    g.px = (e.clientX - r.left) * (W / r.width);
    g.py = (e.clientY - r.top) * (H / r.height);
  }
  function soltar(g) {
    g.pressed = false; g.drag = false;
    g.S.vy += 3.6; /* solta em pulo: fica alto e oscila */
  }
  function ligarEventos(g) {
    var real = g.real;
    real.addEventListener('pointerenter', function (e) { g.hover = true; localizar(e, g); acordar(); });
    real.addEventListener('pointerleave', function () { if (!g.pressed) g.hover = false; acordar(); });
    real.addEventListener('pointerdown', function (e) {
      g.pressed = true; g.drag = false; g.hover = true;
      g.sx0 = e.clientX; g.sy0 = e.clientY; localizar(e, g);
      try { real.setPointerCapture(e.pointerId); } catch (err) {}
      acordar();
    });
    real.addEventListener('pointermove', function (e) {
      localizar(e, g);
      if (g.pressed && !g.drag && Math.hypot(e.clientX - g.sx0, e.clientY - g.sy0) > 6) g.drag = true;
      acordar();
    });
    real.addEventListener('pointerup', function () { if (g.pressed) { soltar(g); acordar(); } });
    real.addEventListener('pointercancel', function () { if (g.pressed) { soltar(g); acordar(); } });
    real.addEventListener('pointerout', function () { if (!g.pressed) { g.hover = false; acordar(); } });
    real.addEventListener('keydown', function (e) {
      if (e.key === ' ' || e.key === 'Enter') {
        if (g.pressed) return;
        g.pressed = true; acordar();
        setTimeout(function () { soltar(g); acordar(); }, 140);
      }
    });
    real.addEventListener('click', function () { acionar(g); acordar(); });
  }

  function acionar(g) {
    var acao = g.b.acao;
    if (acao === 'conta') {
      g.contagem += 1;
      g.pilulaEl.firstChild.textContent = g.contagem;
      g.pilulaEl.classList.remove('rola'); void g.pilulaEl.offsetWidth; g.pilulaEl.classList.add('rola');
      g.txt.textContent = 'Inscrito';
      setTimeout(function () { g.txt.textContent = g.rotuloOriginal; }, 1600);
      nInsc.textContent = g.contagem;
      if (!parado) g.S.vy -= 3;
    } else if (acao === 'coracoes') {
      curtidas += 1; nCurt.textContent = curtidas;
      if (!parado) {
        /* corações saem das duas pontas da cápsula, para os lados e para cima, por trás das peles */
        for (var k = 0; k < 12; k++) {
          var c = document.createElement('span');
          var cor = k % 3 === 2 ? '#f3efe7' : '#E2A23B';
          c.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.1C.9 8.4 3.2 4.5 7 4.5c2.1 0 3.6 1.2 5 3 1.4-1.8 2.9-3 5-3 3.8 0 6.1 3.9 4.6 7.4C19.5 16.4 12 21 12 21z" fill="' + cor + '"/></svg>';
          g.partic.appendChild(c);
          var lado = k % 2 ? 1 : -1;
          var ang = (lado > 0 ? -0.35 : Math.PI + 0.35) + (Math.random() - 0.5) * 0.9;
          var sp = 150 + Math.random() * 130;
          g.gotas.push({el: c, x: lado > 0 ? W - 22 : 22, y: H * 0.45, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 60, t: 0, vida: 0.8 + Math.random() * 0.4, esc: 0.8 + Math.random() * 0.5});
        }
      }
      g.S.vy -= 2;
    } else if (acao === 'caixa' || acao === 'seta') {
      if (!parado) {
        var it = document.createElement('span');
        it.innerHTML = ICONES[acao];
        g.queda.appendChild(it);
        g.itens.push({el: it, y: -52, vy: 0, estado: 'queda', t: 0}); it.style.opacity = 0;
      }
      if (acao === 'caixa') {
        g.selos += 1;
        nKit.textContent = g.selos;
        g.selo.textContent = g.selos;
        g.selo.classList.remove('pop'); void g.selo.offsetWidth; g.selo.classList.add('pop');
        g.selo.style.opacity = 1;
      } else {
        g.txt.textContent = 'Baixado';
        clearTimeout(g.timerRot);
        g.timerRot = setTimeout(function () { g.txt.textContent = g.rotuloOriginal; }, 1500);
      }
    } else if (acao === 'pulso') {
      g.S.vy += parado ? 0 : 4.5;
    }
  }

  /* dedo fantasma: roda até o primeiro toque real (exceto ?demo=1) */
  var dedo = {x: window.innerWidth / 2, y: window.innerHeight / 2}, fantasmaAtivo = !parado, fantasmaParado = false, fOp = 0, fIdx = 0, fT = 0, fDe = {x: 0, y: 0}, fPos = {x: 0, y: 0}, fFase = 0, fAlvo = null;
  var SEQ = [0, 1, 2, 3, 4];
  function centroDe(g) { var r = g.el.getBoundingClientRect(); return {x: r.left + r.width * 0.82, y: r.top + r.height * 0.86}; }
  function ease(k) { return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; }
  function pararFantasma() {
    if (demoParam || fantasmaParado || !fantasmaAtivo) return;
    fantasmaParado = true;
    geleias.forEach(function (g) { if (!g.pressed) g.hover = false; });
  }
  ['pointermove', 'pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(function (ev) {
    window.addEventListener(ev, pararFantasma, {capture: true, passive: true});
  });
  var ghostIdx = 0;
  function fantasmaPasso(dt) {
    if (!fantasmaAtivo) return;
    if (fantasmaParado) {
      fOp = Math.max(0, fOp - dt / 0.3);
      if (fOp === 0) fantasmaAtivo = false;
      dedoEl.style.opacity = fOp.toFixed(3);
      return;
    }
    fOp = Math.min(1, fOp + dt / 0.4);
    fT += dt;
    var g = geleias[SEQ[ghostIdx]];
    if (fFase === 0) {
      fAlvo = centroDe(g);
      var k = Math.min(1, fT / 0.75), e = ease(k);
      fPos = {x: fDe.x + (fAlvo.x - fDe.x) * e, y: fDe.y + (fAlvo.y - fDe.y) * e};
      if (k >= 1) { fFase = 1; fT = 0; g.hover = true; g.pressed = true; g.drag = false; }
    } else if (fFase === 1) {
      /* pressiona e solta no centro do botão */
      g.px = W * 0.82; g.py = H * 0.86; g.hover = true;
      dedoEl.classList.add('apertado');
      if (fT >= 0.2) {
        dedoEl.classList.remove('apertado');
        soltar(g);
        acionar(g);
        fFase = 2; fT = 0;
      }
    } else {
      if (fT >= 1.0) {
        g.hover = false;
        ghostIdx = (ghostIdx + 1) % SEQ.length;
        fDe = {x: fPos.x, y: fPos.y};
        fFase = 0; fT = 0;
      }
    }
    dedoEl.style.opacity = fOp.toFixed(3);
    dedoEl.style.transform = 'translate3d(' + fPos.x.toFixed(1) + 'px,' + fPos.y.toFixed(1) + 'px,0)';
    if (fFase === 1) {
      /* posição do dedo traduzida para o botão em foco */
      geleias.forEach(function (o, j) { if (j !== SEQ[ghostIdx]) { o.hover = false; } });
    }
  }

  /* física da pele: cada ponto tem mola para o alvo e acoplamento com o vizinho */
  function alvos(g) {
    var cx = W / 2, bot = H, S = g.S;
    g.pts.forEach(function (p) {
      var bx = cx + (p.x0 - cx) * S.sx, by = bot - (bot - p.y0) * S.sy;
      var tx = bx, ty = by;
      if (g.hover && !parado) {
        var dx = p.x - g.px, dy = p.y - g.py, d = Math.sqrt(dx * dx + dy * dy);
        if (d < 70) {
          var k = 1 - d / 70, k2 = k * k;
          if (g.pressed) { tx -= p.nx * 7 * k2; ty -= p.ny * 7 * k2; }
          else { tx += p.nx * 9 * k2; ty += p.ny * 9 * k2; }
        }
      }
      if (g.drag && !parado) {
        var ex = g.px - cx, ey = g.py - H / 2, m = Math.sqrt(ex * ex + ey * ey) || 1;
        var ux = ex / m, uy = ey / m, w = Math.max(0, p.nx * ux + p.ny * uy);
        var st = Math.tanh(m / 90) * 26 * w * w;
        tx += ux * st; ty += uy * st;
      }
      p.tx = tx; p.ty = ty;
    });
  }
  function fisica(g, dt) {
    var pts = g.pts, n = pts.length;
    if (parado) {
      pts.forEach(function (p) { p.x = p.tx; p.y = p.ty; p.vx = 0; p.vy = 0; });
      return;
    }
    for (var i = 0; i < n; i++) {
      var p = pts[i], a = pts[(i - 1 + n) % n], c = pts[(i + 1) % n];
      var ax = (p.tx - p.x) * K + ((a.x + c.x) / 2 - p.x) * KC - p.vx * D;
      var ay = (p.ty - p.y) * K + ((a.y + c.y) / 2 - p.y) * KC - p.vy * D;
      p.vx += ax * dt; p.vy += ay * dt;
    }
    for (var j = 0; j < n; j++) { pts[j].x += pts[j].vx * dt; pts[j].y += pts[j].vy * dt; }
  }

  function desenharPele(g) {
    var pts = g.pts, d = caminho(pts);
    g.pele.setAttribute('d', d); g.pool.setAttribute('d', d); g.borda.setAttribute('d', d);
    g.lip.setAttribute('d', d);
    var minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
    pts.forEach(function (p) { if (p.x < minx) minx = p.x; if (p.x > maxx) maxx = p.x; if (p.y < miny) miny = p.y; if (p.y > maxy) maxy = p.y; });
    var w = maxx - minx, h = maxy - miny, cxN = (minx + maxx) / 2, cyN = (miny + maxy) / 2;
    /* rótulo segue a pele com escala afim aproximada pela caixa envolvente */
    g.rot.style.transform = 'translate3d(' + (cxN - W / 2).toFixed(2) + 'px,' + (cyN - H / 2).toFixed(2) + 'px,0) scale(' + (w / W).toFixed(4) + ',' + (h / H).toFixed(4) + ')';
    g.brilho.setAttribute('cx', cxN.toFixed(2)); g.brilho.setAttribute('cy', (miny + 13).toFixed(2));
    g.brilho.setAttribute('rx', (w * 0.36).toFixed(2)); g.brilho.setAttribute('ry', '6.5');
    g.faisca.setAttribute('cx', (minx + w * 0.16).toFixed(2)); g.faisca.setAttribute('cy', (miny + 18).toFixed(2));
    g.faisca.setAttribute('r', '2.6');
  }

  function atualizarEfeitos(g, dt) {
    /* gotas de coração */
    for (var i = g.gotas.length - 1; i >= 0; i--) {
      var q = g.gotas[i];
      q.t += dt;
      q.vy += 520 * dt;
      q.x += q.vx * dt; q.y += q.vy * dt;
      var k = q.t / q.vida;
      q.el.style.transform = 'translate3d(' + (q.x - 10).toFixed(1) + 'px,' + (q.y - 10).toFixed(1) + 'px,0) scale(' + (q.esc * (1 - k * 0.4)).toFixed(3) + ')';
      q.el.style.opacity = Math.max(0, 1 - k).toFixed(3);
      if (q.t >= q.vida) { q.el.remove(); g.gotas.splice(i, 1); }
    }
    /* caixa ou seta caindo sobre a geleia, quica e some */
    var topo = Math.min.apply(null, g.pts.map(function (p) { return p.y; }));
    for (var j = g.itens.length - 1; j >= 0; j--) {
      var it = g.itens[j];
      it.t += dt;
      if (it.estado === 'queda') {
        /* surge no ar (fade) logo acima da própria cápsula, sem atravessar o botão vizinho */
        it.el.style.opacity = Math.min(1, it.t / 0.12).toFixed(3);
        it.vy += 1900 * dt;
        it.y += it.vy * dt;
        if (it.y >= topo - 36) {
          it.y = topo - 36; it.estado = 'quica'; it.vy = -300; g.S.vy -= 7;
        }
      } else if (it.estado === 'quica') {
        it.vy += 1900 * dt; it.y += it.vy * dt;
        if (it.vy > 0 && it.y >= topo - 36) { it.y = topo - 36; it.estado = 'parado'; it.t = 0; }
      } else if (it.estado === 'parado' && it.t > 0.7) {
        it.estado = 'some'; it.t = 0;
      } else if (it.estado === 'some') {
        var f = Math.max(0, 1 - it.t / 0.35);
        it.el.style.opacity = f.toFixed(3);
        if (f <= 0) { it.el.remove(); g.itens.splice(j, 1); continue; }
      }
      it.el.style.transform = 'translate3d(' + (W - 56).toFixed(1) + 'px,' + (it.y).toFixed(1) + 'px,0)';
    }
  }

  /* um único loop de animação, pausado fora da tela */
  var raf = 0, last = 0, vis = true;
  function quadro(t) {
    raf = 0;
    var dt = last ? Math.min(1 / 30, (t - last) / 1000) : 1 / 60;
    last = t;
    fantasmaPasso(dt);
    geleias.forEach(function (g) {
      alvos(g);
      fisica(g, dt);
      var afunda = g.pressed && !g.drag;
      if (!parado) {
        var aY = ((afunda ? 0.83 : 1) - g.S.sy) * KS - g.S.vy * DS;
        g.S.vy += aY * dt; g.S.sy += g.S.vy * dt;
        var aX = ((afunda ? 1.07 : 1) - g.S.sx) * KS - g.S.vx * DS;
        g.S.vx += aX * dt; g.S.sx += g.S.vx * dt;
      } else {
        g.S.sy = afunda ? 0.83 : 1; g.S.sx = afunda ? 1.07 : 1; g.S.vx = 0; g.S.vy = 0;
      }
      desenharPele(g);
      atualizarEfeitos(g, parado ? 0 : dt);
    });
    if (vis && !document.hidden) raf = requestAnimationFrame(quadro);
  }
  function acordar() { if (!raf && vis && !document.hidden) { last = 0; raf = requestAnimationFrame(quadro); } }

  /* raio-X (?motion=xray) */
  var xrayLista = [];
  if (xrayOn) {
    var camada = document.createElement('div');
    camada.id = 'xray-layer';
    camada.setAttribute('aria-hidden', 'true');
    document.body.appendChild(camada);
    document.querySelectorAll('[data-xray]').forEach(function (el) {
      var c = document.createElement('div'); c.className = 'xray-caixa';
      var t = document.createElement('div'); t.className = 'xray-rotulo';
      t.textContent = el.getAttribute('data-xray');
      camada.appendChild(c); camada.appendChild(t);
      xrayLista.push({el: el, c: c, t: t});
    });
  }
  function xrayAtualizar() {
    xrayLista.forEach(function (x) {
      var r = x.el.getBoundingClientRect();
      x.c.style.transform = 'translate3d(' + r.left.toFixed(1) + 'px,' + r.top.toFixed(1) + 'px,0)';
      x.c.style.width = r.width.toFixed(1) + 'px';
      x.c.style.height = r.height.toFixed(1) + 'px';
      x.t.style.transform = 'translate3d(' + r.left.toFixed(1) + 'px,' + Math.max(0, r.top - 20).toFixed(1) + 'px,0)';
    });
  }
  var quadroRaiox = quadro;
  quadro = function (t) { quadroRaiox(t); xrayAtualizar(); };

  var io = new IntersectionObserver(function (es) {
    vis = es[0].isIntersecting;
    if (vis) acordar();
    else if (raf) { cancelAnimationFrame(raf); raf = 0; }
  });
  io.observe(palco);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
    else acordar();
  });
  fDe = {x: window.innerWidth / 2, y: window.innerHeight + 40}; fPos = {x: fDe.x, y: fDe.y};
  if (!fantasmaAtivo) dedoEl.style.display = 'none';
  acordar();
})();
</script>
</body>
